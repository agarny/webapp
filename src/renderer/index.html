<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>OpenCOR</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src * data:; script-src 'unsafe-eval'; script-src-elem 'self' https://apis.google.com https://cdn.jsdelivr.net https://fastly.jsdelivr.net https://gcore.jsdelivr.net https://cors-proxy.opencor.workers.dev; worker-src 'self' blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-src 'self' https://opencorapp.firebaseapp.com; img-src 'self' blob: data:" />
    <style scoped>
    body {
      background-color: #ffffff; /* Light version of --p-content-background. */
      color: #334155; /* Light version of --p-content-color. */
      margin: 0;
      overflow: hidden;
    }
    @media (prefers-color-scheme: dark) {
      :root:not(.opencor-light-mode) body {
        background-color: #18181b; /* Dark version of --p-content-background. */
        color: #ffffff; /* Dark version of --p-content-color. */
      }
    }
    :root.opencor-dark-mode body {
      background-color: #18181b; /* Dark version of --p-content-background. */
      color: #ffffff; /* Dark version of --p-content-color. */
    }
    /**
     * What we show until OpenCOR has been loaded (and mounted, which replaces the contents of #app), i.e. the message
     * that OpenCOR shows while it is being initialised (see BlockingMessageComponent.vue), at 0%, so that both look
     * like a single step to the user.
     * Note: OpenCOR is not loaded yet, so we don't have access to PrimeVue and must therefore hard-code colours.
     */
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
      box-sizing: border-box;
      width: max-content;
      min-width: min(16rem, calc(100% - 1rem));
      max-width: min(24rem, calc(100% - 1rem));
      padding: 0.75rem 1rem;
      border: 1px solid #e2e8f0; /* Light version of --p-content-border-color. */
      border-radius: 0.75rem;
      background-color: #ffffff; /* Light version of --p-content-background. */
      box-shadow: 0 0.25rem 1rem rgb(0 0 0 / 12%);
      font-family:
        Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans",
        "Droid Sans", "Helvetica Neue", sans-serif;
      line-height: 1.5;
      transform: translate(-50%, -50%);
      -webkit-font-smoothing: antialiased;
    }
    .loading-header {
      display: flex;
      align-items: center;
      gap: 0.625rem;
    }
    .loading-spinner {
      flex-shrink: 0;
      width: 1.125rem;
      height: 1.125rem;
      box-sizing: border-box;
      border: 2px solid rgb(16 185 129 / 20%); /* Light version of --p-primary-color. */
      border-top-color: #10b981; /* Light version of --p-primary-color. */
      border-radius: 50%;
      animation: loading-spin 0.8s linear infinite;
    }
    @keyframes loading-spin {
      to {
        transform: rotate(360deg);
      }
    }
    .loading-text {
      flex-grow: 1;
      font-size: 0.875rem;
      font-weight: 500;
      white-space: nowrap;
    }
    .loading-progress {
      color: #64748b; /* Light version of --p-text-muted-color. */
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
    }
    .loading-progress-bar {
      height: 0.25rem;
      border-radius: 6px; /* --p-content-border-radius. */
      background-color: #e2e8f0; /* Light version of --p-content-border-color. */
    }
    @media (prefers-color-scheme: dark) {
      :root:not(.opencor-light-mode) .loading {
        border-color: #3f3f46; /* Dark version of --p-content-border-color. */
        background-color: #18181b; /* Dark version of --p-content-background. */
      }
      :root:not(.opencor-light-mode) .loading-spinner {
        border-color: rgb(52 211 153 / 20%); /* Dark version of --p-primary-color. */
        border-top-color: #34d399; /* Dark version of --p-primary-color. */
      }
      :root:not(.opencor-light-mode) .loading-progress {
        color: #a1a1aa; /* Dark version of --p-text-muted-color. */
      }
      :root:not(.opencor-light-mode) .loading-progress-bar {
        background-color: #3f3f46; /* Dark version of --p-content-border-color. */
      }
    }
    :root.opencor-dark-mode .loading {
      border-color: #3f3f46; /* Dark version of --p-content-border-color. */
      background-color: #18181b; /* Dark version of --p-content-background. */
    }
    :root.opencor-dark-mode .loading-spinner {
      border-color: rgb(52 211 153 / 20%); /* Dark version of --p-primary-color. */
      border-top-color: #34d399; /* Dark version of --p-primary-color. */
    }
    :root.opencor-dark-mode .loading-progress {
      color: #a1a1aa; /* Dark version of --p-text-muted-color. */
    }
    :root.opencor-dark-mode .loading-progress-bar {
      background-color: #3f3f46; /* Dark version of --p-content-border-color. */
    }
    </style>
  </head>
  <body>
    <div id="app" style="height: 100vh; height: 100dvh;">
      <div class="loading">
        <div class="loading-header">
          <span class="loading-spinner"></span>
          <span class="loading-text">Initialising OpenCOR...</span>
          <span class="loading-progress">0%</span>
        </div>
        <div class="loading-progress-bar"></div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
