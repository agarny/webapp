appId: ws.opencor.app
productName: OpenCOR
# Only package what is needed at runtime, i.e. our built main, preload, and renderer files (out/), the files used by our
# splash screen window and for our application icon (src/main/assets/ and our logo), and package.json.
# Note: our production dependencies get added automatically.
files:
  - out/**
  - src/main/assets/**
  - "!src/main/assets/README.md"
  - src/renderer/src/assets/logo.svg
  - package.json
publish:
  provider: github
  channel: latest-${arch}
  releaseType: release
win:
  artifactName: ${productName}-${version}-Windows-${arch}.${ext}
  target:
    - nsis
    - zip
nsis:
  uninstallDisplayName: ${productName}
linux:
  artifactName: ${productName}-${version}-Linux-${arch}.${ext}
  category: Utility
  executableName: OpenCOR
  target:
    - AppImage
    - tar.gz
mac:
  artifactName: ${productName}-${version}-macOS-${arch}.${ext}
  target:
    - dmg
    - zip
protocols:
  name: OpenCOR
  schemes:
    - opencor
