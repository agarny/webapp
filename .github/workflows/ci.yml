name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (Intel)
            os: windows-2022
          - name: Windows (ARM)
            os: windows-11-arm
          - name: Linux (Intel)
            os: ubuntu-22.04
          - name: Linux (ARM)
            os: ubuntu-22.04-arm
          - name: macOS (Intel)
            os: macos-15-intel
          - name: macOS (ARM)
            os: macos-15
          - name: Code formatting
            os: ubuntu-22.04
          - name: Linting
            os: ubuntu-22.04
          - name: Type checking
            os: ubuntu-22.04
    steps:
      - name: Set the timezone to New Zealand
        shell: bash
        run: |
          case "${RUNNER_OS}" in
            Windows) MSYS_NO_PATHCONV=1 tzutil /s "New Zealand Standard Time" ;;
            Linux) sudo timedatectl set-timezone Pacific/Auckland ;;
            macOS) sudo systemsetup -settimezone Pacific/Auckland ;;
          esac
      - name: Check out OpenCOR
        uses: actions/checkout@v7
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - name: Install GCC 16
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-16 100
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-16 100
          echo "CC=gcc-16" >> "$GITHUB_ENV"
          echo "CXX=g++-16" >> "$GITHUB_ENV"
      - name: OpenCOR dependencies
        run: bun install
      - name: Build OpenCOR
        if: ${{ matrix.name != 'Code formatting' && matrix.name != 'Linting' && matrix.name != 'Type checking' }}
        run: bun run build
      - name: Build OpenCOR's Web app
        if: ${{ matrix.name != 'Code formatting' && matrix.name != 'Linting' && matrix.name != 'Type checking' }}
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: bun build:web
      - name: Build OpenCOR as a library
        if: ${{ matrix.name != 'Code formatting' && matrix.name != 'Linting' && matrix.name != 'Type checking' }}
        run: |
          cd src/renderer
          bun install
          bun build:lib
      - name: Code formatting
        if: ${{ matrix.name == 'Code formatting' }}
        run: bun format:check
      - name: Linting
        if: ${{ matrix.name == 'Linting' }}
        run: bun lint
      - name: Type checking
        if: ${{ matrix.name == 'Type checking' }}
        run: bun typecheck
      - name: Clean OpenCOR
        run: bun clean
