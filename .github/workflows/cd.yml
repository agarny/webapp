name: CD

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  version:
    if: ${{ github.repository == 'opencor/webapp' }}
    name: Version
    runs-on: ubuntu-22.04
    steps:
      - name: Check out OpenCOR
        uses: actions/checkout@v7
      - name: Check the version
        # Make sure that our tag is our version number (i.e. vX.YYYYMMDD.Z for version X.YYYYMMDD.Z), both for OpenCOR
        # and for OpenCOR as a component, so that we never release or publish a version that is not the one we tagged.
        # Note: there is no tag to check if we are run manually from a branch.
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::notice::Not run from a tag, so not checking the version."

            exit 0
          fi

          for PACKAGE_JSON in package.json src/renderer/package.json; do
            VERSION=$(jq -r .version "${PACKAGE_JSON}")

            if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} doesn't match version ${VERSION} in ${PACKAGE_JSON} (expected v${VERSION})."

              exit 1
            fi
          done
  releases:
    if: ${{ github.repository == 'opencor/webapp' }}
    needs: version
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (Intel)
            os: windows-2022
          - name: Windows (ARM)
            os: windows-11-arm
          - name: Linux (Intel)
            os: ubuntu-22.04
          - name: Linux (ARM)
            os: ubuntu-22.04-arm
          - name: macOS (Intel)
            os: macos-15-intel
          - name: macOS (ARM)
            os: macos-15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CSC_LINK: EVCertificate.pfx
      WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.EV_CERTIFICATE_PASSWORD }}
      EV_CERTIFICATE_BASE64: ${{ secrets.EV_CERTIFICATE_BASE64 }}
      MACOS_CSC_LINK: DeveloperIDApplicationCertificate.p12
      MACOS_CSC_KEY_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
      DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
    steps:
      - name: Set the timezone to New Zealand
        shell: bash
        run: |
          case "${RUNNER_OS}" in
            Windows) MSYS_NO_PATHCONV=1 tzutil /s "New Zealand Standard Time" ;;
            Linux) sudo timedatectl set-timezone Pacific/Auckland ;;
            macOS) sudo systemsetup -settimezone Pacific/Auckland ;;
          esac
      - name: Check out OpenCOR
        uses: actions/checkout@v7
      - name: Retrieve the EV certificate (Windows only)
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          echo "CSC_LINK=$(echo $WINDOWS_CSC_LINK)" >> $GITHUB_ENV
          echo "CSC_KEY_PASSWORD=$(echo $WINDOWS_CSC_KEY_PASSWORD)" >> $GITHUB_ENV
          echo -n $EV_CERTIFICATE_BASE64 | base64 -d > $WINDOWS_CSC_LINK
      - name: Retrieve the Developer ID Application certificates (macOS only)
        if: ${{ runner.os == 'macOS' }}
        run: |
          echo "CSC_LINK=$(echo $MACOS_CSC_LINK)" >> $GITHUB_ENV
          echo "CSC_KEY_PASSWORD=$(echo $MACOS_CSC_KEY_PASSWORD)" >> $GITHUB_ENV
          echo -n $DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 | base64 -d > $MACOS_CSC_LINK
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - name: Install GCC 16
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-16 100
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-16 100
          echo "CC=gcc-16" >> "$GITHUB_ENV"
          echo "CXX=g++-16" >> "$GITHUB_ENV"
      - name: Install libopenjp2-tools (Linux ARM only)
        if: ${{ matrix.name == 'Linux (ARM)' }}
        run: |
          sudo apt update
          sudo apt install libopenjp2-tools
      - name: OpenCOR dependencies
        run: bun install --frozen-lockfile
      - name: Build OpenCOR
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: bun run build
      - name: Release OpenCOR
        run: bun release
  web_app:
    if: ${{ github.repository == 'opencor/webapp' }}
    needs: version
    name: Web app
    runs-on: ubuntu-22.04
    concurrency:
      group: web-app-deployment-app
      cancel-in-progress: false
    # Note: our deployments must not overlap since they would otherwise interfere with one another, e.g. when uploading
    #       index.html or when pruning our old assets (see below).
    steps:
      - name: Set the timezone to New Zealand
        run: sudo timedatectl set-timezone Pacific/Auckland
      - name: Check out OpenCOR
        uses: actions/checkout@v7
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - name: OpenCOR dependencies
        run: bun install --frozen-lockfile
      - name: Build OpenCOR's Web app
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: bun build:web
      - name: Archive OpenCOR's Web app
        id: archive
        run: bun archive:web
        # Note: we archive our Web app before deploying it since the deployment adds a .deploy-running file to
        #       src/renderer/dist, which would otherwise end up in our archive.
      - name: Deploy to https://opencor.ws/app/
        id: deploy
        uses: milanmk/actions-file-deployer@master
        with:
          remote-protocol: sftp
          remote-host: ${{ secrets.REMOTE_HOST }}
          remote-user: ${{ secrets.REMOTE_USER }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          local-path: ./src/renderer/dist
          remote-path: /home/www/opencor.ws/app
          sync: full
          ftp-options: set cmd:fail-exit yes; set xfer:use-temp-file yes
          # Note #1: lftp carries on after a command has failed, so we ask it to exit instead. Otherwise, if some of our
          #          assets couldn't be uploaded, index.html and version.json would still get uploaded (see below), and
          #          index.html would reference assets that are not available.
          # Note #2: lftp uploads a file in place by default, and it uploads all our files on every deployment (since
          #          they are all newer than their remote counterpart), including assets that are still referenced by
          #          the live index.html. So, a browser could get a partially uploaded asset and, since our hashed
          #          assets are cached for good (see public/.htaccess), keep using it. So, we ask lftp to upload each
          #          file to a temporary file (named .in.<file name>), which it then renames to its final name.
          ftp-mirror-options: --exclude-glob=index.html --exclude-glob=assets/version.json
          ftp-post-sync-commands: put -O /home/www/opencor.ws/app ./src/renderer/dist/index.html; put -O /home/www/opencor.ws/app/assets ./src/renderer/dist/assets/version.json
          # Note: our assets have a hash in their file names, so we upload index.html (which references them) once they
          #       have all been uploaded, so that it never references assets that are not available yet. Then, we upload
          #       version.json last so that OpenCOR's Web app only reports a new version once all the other files have
          #       been uploaded.
      - name: Release OpenCOR's Web app
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        uses: softprops/action-gh-release@v3
        with:
          files: dist/OpenCOR-*-WebApp.tar.gz
        # Note: we release our Web app even if it couldn't be deployed, so that a deployment failure (e.g., a transient
        #       SFTP error) doesn't also deprive our release of its Web app archive.
      - name: Prune old assets from https://opencor.ws/app/
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        env:
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: bun prune:web /home/www/opencor.ws/app
        # Note: our assets have a hash in their file names, so old assets would otherwise accumulate on the server. They
        #       are only deleted after a grace period since some clients may still be using a previous index.html (see
        #       src/renderer/scripts/prune.web.ts).
  npm:
    if: ${{ github.repository == 'opencor/webapp' }}
    needs: version
    name: npm
    runs-on: ubuntu-22.04
    steps:
      - name: Set the timezone to New Zealand
        run: sudo timedatectl set-timezone Pacific/Auckland
      - name: Check out OpenCOR
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
      - name: Update npm
        # Install the latest version of npm since we need npm 11.5.1 or later to publish to npm using OIDC (see
        # https://docs.npmjs.com/trusted-publishers).
        run: npm install -g npm@latest
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - name: OpenCOR dependencies
        run: |
          cd src/renderer
          bun install --frozen-lockfile
      - name: Build OpenCOR as a component
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: |
          cd src/renderer
          bun build:lib
      - name: Publish OpenCOR
        # bun cannot currently be used to publish to npm using OIDC (see https://github.com/oven-sh/bun/issues/22423 and
        # https://github.com/oven-sh/bun/issues/15601), so we use npm instead. To publish using OIDC implies automatic
        # provenance generation, so no need to specify --provenance (see https://docs.npmjs.com/trusted-publishers).
        # Provenance requires "repository.url" in package.json to match the repository from which we are publishing. In
        # our case, it means that we can only publish to npm from the "opencor/webapp" repository. (Provenance can be
        # disabled, but we prefer to be open.)
        run: |
          cd src/renderer
          npm publish --access public
